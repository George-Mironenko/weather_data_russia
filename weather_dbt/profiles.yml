# Copy this file to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR to this folder).
#
# host: use "localhost" if you run dbt from your host machine (docker-compose
# publishes 5432:5432). Use "postgres" instead if you run dbt from inside the
# same docker network as the other services.

weather_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5832
      user: airflow
      password: airflow
      dbname: airflow
      schema: public
      threads: 4
